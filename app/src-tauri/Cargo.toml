[package]
name = "veyrix"
description = "Veyrix-rs — окно"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# Суффикс _lib нужен, чтобы имя библиотеки не совпало с именем exe (cargo#8519).
name = "veyrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Версии Tauri — в той же паре major.minor, что npm-пакеты в app/package.json (tauri build это проверяет).
[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
vx-engine = { path = "../../crates/engine" }
log = "0.4"
tauri-plugin-log = "2.10"
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
