name: Release

# Тег vX.Y.Z → проверки, сборка окна, установщик и пакет zip с WinDivert и черновик релиза.
# Для уже созданного тега — запуск вручную (Actions → Release → Run workflow, tag = vX.Y.Z): код берётся из тега,
# этот файл — из выбранной ветки.
# Опубликовать черновик — кнопкой Publish на GitHub (или `gh release edit vX.Y.Z --draft=false`).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например, v0.1.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  # Официальный WinDivert 2.2.2-A (basil00): архив и файлы сверяются по хешам, у драйвера ещё проверяется подпись.
  # Драйвер в официальном архиве подписан компанией 成都密思听科技有限公司 (тот же файл, что и в zapret-win-bundle).
  WINDIVERT_URL: https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip
  WINDIVERT_ZIP_SHA256: 63cb41763bb4b20f600b6de04e991a9c2be73279e317d4d82f237b150c5f3f15
  WINDIVERT_DLL_SHA256: c1e060ee19444a259b2162f8af0f3fe8c4428a1c6f694dce20de194ac8d7d9a2
  WINDIVERT_SYS_SHA256: 8da085332782708d8767bcace5327a6ec7283c17cfb85e40b03cd2323a90ddc2

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Version matches tag
        shell: pwsh
        run: |
          $tag = $env:TAG.TrimStart('v')
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $npm = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($cargo -ne $tag -or $npm -ne $tag -or $tauri -ne $tag) {
            throw "Тег $tag, а версии: Cargo.toml $cargo, package.json $npm, tauri.conf.json $tauri"
          }
          if (-not (Test-Path "docs/releases/v$tag.md")) { throw "Нет описания релиза docs/releases/v$tag.md" }

      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: WinDivert
        shell: pwsh
        run: |
          Invoke-WebRequest $env:WINDIVERT_URL -OutFile windivert.zip
          "архив  $((Get-FileHash windivert.zip).Hash.ToLower())"
          Expand-Archive windivert.zip -DestinationPath windivert
          $root = (Get-ChildItem windivert -Directory | Select-Object -First 1).FullName
          $dll = "$root/x64/WinDivert.dll"
          $sys = "$root/x64/WinDivert64.sys"
          "dll    $((Get-FileHash $dll).Hash.ToLower())"
          "sys    $((Get-FileHash $sys).Hash.ToLower())"
          if ((Get-FileHash windivert.zip).Hash.ToLower() -ne $env:WINDIVERT_ZIP_SHA256) { throw "Архив WinDivert: хеш не совпадает с ожидаемым" }
          if ((Get-FileHash $dll).Hash.ToLower() -ne $env:WINDIVERT_DLL_SHA256) { throw "WinDivert.dll: хеш не совпадает с ожидаемым" }
          if ((Get-FileHash $sys).Hash.ToLower() -ne $env:WINDIVERT_SYS_SHA256) { throw "WinDivert64.sys: хеш не совпадает с ожидаемым" }
          $sig = Get-AuthenticodeSignature $sys
          "подпись драйвера: $($sig.Status), $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "WinDivert64.sys: подпись недействительна ($($sig.Status))" }
          if (-not (Test-Path "$root/LICENSE")) { throw "В архиве WinDivert нет LICENSE" }
          "WINDIVERT_DIR=$root" >> $env:GITHUB_ENV
          # Установщик берёт WinDivert и его лицензию отсюда (tauri.nsis.conf.json).
          New-Item -ItemType Directory -Force app/src-tauri/engine | Out-Null
          Copy-Item $dll, $sys app/src-tauri/engine
          Copy-Item "$root/LICENSE" app/src-tauri/engine/WinDivert-LICENSE.txt

      - name: WARP (wgcf, wireproxy)
        shell: pwsh
        run: ./tools/fetch-warp.ps1 -Dest app/src-tauri/engine/warp

      - name: Build
        shell: pwsh
        working-directory: app
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run lint
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Установщик NSIS; target/release/veyrix.exe из этой же сборки идёт в архив.
          bun run tauri build --config src-tauri/tauri.nsis.conf.json

      - name: Package
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $name = "Veyrix-rs-$version-x64"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force "$dir/engine", "$dir/licenses" | Out-Null
          Copy-Item target/release/veyrix.exe $dir
          Copy-Item "$env:WINDIVERT_DIR/x64/WinDivert.dll", "$env:WINDIVERT_DIR/x64/WinDivert64.sys" "$dir/engine"
          Copy-Item README.md, LICENSE, THIRD-PARTY-LICENSES.md $dir
          Copy-Item "$env:WINDIVERT_DIR/LICENSE" "$dir/licenses/WinDivert-LICENSE.txt"
          New-Item -ItemType Directory -Force "$dir/engine/warp" | Out-Null
          Copy-Item app/src-tauri/engine/warp/wgcf.exe, app/src-tauri/engine/warp/wireproxy.exe "$dir/engine/warp"
          Copy-Item app/src-tauri/engine/warp/*-LICENSE.txt "$dir/licenses"
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"
          Copy-Item "target/release/bundle/nsis/Veyrix-rs_${version}_x64-setup.exe" "dist/$name-setup.exe"
          $sums = Get-ChildItem dist -File | ForEach-Object { "$((Get-FileHash $_.FullName).Hash.ToLower())  $($_.Name)" }
          $sums | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:TAG.TrimStart('v')
          # Версия с суффиксом (0.2.0-beta) — предварительный выпуск: не становится «последним».
          $ghArgs = @('release', 'create', $env:TAG, "dist/Veyrix-rs-$version-x64-setup.exe", "dist/Veyrix-rs-$version-x64.zip", 'dist/SHA256SUMS.txt',
            '--draft', '--verify-tag', '--title', "Veyrix-rs $version", '--notes-file', "docs/releases/$env:TAG.md")
          if ($version.Contains('-')) { $ghArgs += '--prerelease' }
          & gh @ghArgs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
